name: update-notices

on:
  schedule:
    - cron: "*/30 * * * *"   # discover new notices (current year; + last year in Jan/Feb)
    - cron: "0 20 * * *"     # daily 04:00 MYT: re-check articles from the last 45 days for edits
    - cron: "0 21 * * 0"     # weekly: reconcile every year's listing (catches backdated additions)
    - cron: "0 22 1 * *"     # monthly: re-fetch ALL articles to detect historical edits
  workflow_dispatch:
    inputs:
      mode:
        description: "discover | recheck | reconcile | deep | backfill"
        default: discover

permissions:
  contents: write

concurrency:
  group: update-notices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scraper.txt
      - run: pip install -r requirements-scraper.txt

      - name: Pick mode
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "0 20 * * *")   MODE=recheck ;;
            "0 21 * * 0")   MODE=reconcile ;;
            "0 22 1 * *")   MODE=deep ;;
            "")             MODE="${{ inputs.mode }}" ;;
            *)              MODE=discover ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Collect
        env:
          BNM_USER_AGENT: "bnm-notices-collector/1.0 (+https://github.com/${{ github.repository }})"
        run: |
          case "${{ steps.m.outputs.mode }}" in
            recheck)   python -m scraper.collect --recheck-days 45 ;;
            reconcile) python -m scraper.collect --full ;;
            deep)      python -m scraper.collect --full --recheck-all ;;
            backfill)  python -m scraper.collect --full ;;
            *)         python -m scraper.collect ;;
          esac

      - name: Commit changes (only if data changed)
        run: |
          git config user.name  "bnm-notices-bot"
          git config user.email "bnm-notices-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"; exit 0
          fi
          git commit -m "data: update notices ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
